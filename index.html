<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://checkout.dodopayments.com" />

    <link rel="preconnect" href="https://live.dodopayments.com" />
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Lazora - AI Product Photography Studio</title>
    <meta name="title" content="Lazora - AI Product Photography Studio" />
    <meta name="description" content="Create stunning product photos with AI. No studio, no photographer needed. Upload your product and generate professional shots in seconds." />
    <meta name="keywords" content="AI product photography, product photos, AI studio, ecommerce photos, product images, AI photo generator" />
    <meta name="author" content="Lazora" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lazoraai.com/" />
    <meta property="og:title" content="Lazora - AI Product Photography Studio" />
    <meta property="og:description" content="Create stunning product photos with AI. No studio, no photographer needed." />
    <meta property="og:image" content="https://www.lazoraai.com/og-image.png" />
    <meta property="og:site_name" content="Lazora" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.lazoraai.com/" />
    <meta name="twitter:title" content="Lazora - AI Product Photography Studio" />
    <meta name="twitter:description" content="Create stunning product photos with AI. No studio, no photographer needed." />
    <meta name="twitter:image" content="https://www.lazoraai.com/og-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              glass: "rgba(255, 255, 255, 0.1)",
              glassBorder: "rgba(255, 255, 255, 0.2)",
            },
            backdropBlur: {
              xs: '2px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        /* Default to Light Mode colors, handled by Tailwind classes in App.tsx */
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f3f4f6; /* Gray 100 */
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b; /* Slate 800 */
      }
      
      ::-webkit-scrollbar-thumb {
        background: #9ca3af; /* Gray 400 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; /* Slate 600 */
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* Gray 500 */
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Responsive Glass Panel */
      .glass-panel {
        background: rgba(255, 255, 255, 0.55); /* Light Mode: More Transparent (Enhanced Glass) */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(226, 232, 240, 0.6); /* Slate 200 */
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.05), 0 4px 8px -2px rgba(0, 0, 0, 0.02);
      }
      
      .dark .glass-panel {
        background: rgba(255, 255, 255, 0.05); /* Dark Mode: Clear Glass */
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }

      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #c084fc, #ec4899);
      }
      .text-gradient-brand {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #c084fc, #ec4899); 
      }
      .text-gradient-blue {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #3b82f6, #06b6d4);
      }
    </style>

}
</script>
