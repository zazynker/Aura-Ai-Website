<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Lazora — AI Image & Video Generator with Creative Workflows</title>
    <meta name="title" content="Lazora — AI Image & Video Generator with Creative Workflows" />
    <meta name="description" content="Create AI images and videos, explore step-by-step workflows with prompts, materials, and settings, then share or recreate the creative process." />
    <meta name="keywords" content="AI image generator, AI video generator, AI creative workflows, AI workflow breakdowns, AI prompts, AI creator platform, recreate AI content" />
    <meta name="author" content="Lazora" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lazoraai.com/" />
    <meta property="og:title" content="Lazora — AI Image & Video Generator with Creative Workflows" />
    <meta property="og:description" content="Create AI images and videos, explore transparent creator workflows, and share or recreate the creative process." />
    <meta property="og:image" content="https://www.lazoraai.com/og-image.png" />
    <meta property="og:site_name" content="Lazora" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.lazoraai.com/" />
    <meta name="twitter:title" content="Lazora — AI Image & Video Generator with Creative Workflows" />
    <meta name="twitter:description" content="Create AI images and videos, explore transparent creator workflows, and share or recreate the creative process." />
    <meta name="twitter:image" content="https://www.lazoraai.com/og-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#7c3aed" />

    <style>
      body {
        /* Default to Light Mode colors, handled by Tailwind classes in App.tsx */
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f3f4f6; /* Gray 100 */
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b; /* Slate 800 */
      }
      
      ::-webkit-scrollbar-thumb {
        background: #9ca3af; /* Gray 400 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; /* Slate 600 */
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* Gray 500 */
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Responsive Glass Panel */
      .glass-panel {
        background: rgba(255, 255, 255, 0.55); /* Light Mode: More Transparent (Enhanced Glass) */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(226, 232, 240, 0.6); /* Slate 200 */
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.05), 0 4px 8px -2px rgba(0, 0, 0, 0.02);
      }
      
      .dark .glass-panel {
        background: rgba(255, 255, 255, 0.05); /* Dark Mode: Clear Glass */
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }

      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #c084fc, #ec4899);
      }
      .text-gradient-brand {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #c084fc, #ec4899); 
      }
      .text-gradient-blue {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        background-image: linear-gradient(to right, #3b82f6, #06b6d4);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
